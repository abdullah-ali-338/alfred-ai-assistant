<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget AI</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2309090b'/><text y='.9em' font-size='65' x='18' fill='%235eead4' font-family='monospace' font-weight='bold'>&gt;_</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-dark: #0f0f0f;
            --bg-dark-secondary: #1a1a1a;
            --surface-dark: rgba(255, 255, 255, 0.08);
            --surface-dark-hover: rgba(255, 255, 255, 0.12);
            --border-dark: rgba(255, 255, 255, 0.1);
            --text-dark: #e5e5e5;
            --text-dark-muted: #a0a0a0;
            --primary-dark: #10a37f;

            --bg-light: #f7f7f7;
            --bg-light-secondary: #ffffff;
            --surface-light: rgba(0, 0, 0, 0.05);
            --surface-light-hover: rgba(0, 0, 0, 0.08);
            --border-light: rgba(0, 0, 0, 0.08);
            --text-light: #0d0d0d;
            --text-light-muted: #6b6b6b;
            --primary-light: #0d9678;

            --bg: var(--bg-dark);
            --bg-secondary: var(--bg-dark-secondary);
            --surface: var(--surface-dark);
            --surface-hover: var(--surface-dark-hover);
            --border: var(--border-dark);
            --text: var(--text-dark);
            --text-muted: var(--text-dark-muted);
            --primary: var(--primary-dark);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--bg) 0%, var(--bg-secondary) 100%);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 16px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        body.light-mode {
            --bg: var(--bg-light);
            --bg-secondary: var(--bg-light-secondary);
            --surface: var(--surface-light);
            --surface-hover: var(--surface-light-hover);
            --border: var(--border-light);
            --text: var(--text-light);
            --text-muted: var(--text-light-muted);
            --primary: var(--primary-light);
        }

        .glass {
            background: var(--surface);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 20px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 900px;
            margin-bottom: 20px;
            gap: 14px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-logo {
            width: 40px;
            height: 40px;
            background: var(--primary);
            border-radius: 12px;
            display: grid;
            place-items: center;
            flex-shrink: 0;
        }

        .brand-logo svg {
            width: 22px;
            height: 22px;
            fill: var(--bg);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .theme-toggle {
            width: 44px;
            height: 44px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .theme-toggle:hover {
            background: var(--surface-hover);
        }

        .theme-toggle svg {
            width: 20px;
            height: 20px;
            fill: var(--text);
            transition: transform 0.3s ease;
        }

        .theme-toggle:active {
            transform: scale(0.95);
        }

        #chat-container {
            width: 100%;
            max-width: 900px;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 20px 12px;
            scrollbar-width: thin;
            scrollbar-color: var(--surface) transparent;
        }

        #chat-container::-webkit-scrollbar {
            width: 6px;
        }

        #chat-container::-webkit-scrollbar-track {
            background: transparent;
        }

        #chat-container::-webkit-scrollbar-thumb {
            background: var(--surface);
            border-radius: 3px;
        }

        #chat-container::-webkit-scrollbar-thumb:hover {
            background: var(--surface-hover);
        }

        .message-group {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            animation: slideIn 0.3s ease-out;
        }

        .message-group.user {
            justify-content: flex-end;
        }

        .message-group.bot {
            justify-content: flex-start;
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-width: 85%;
        }

        .message-group.user .message-wrapper {
            align-items: flex-end;
        }

        .message-group.bot .message-wrapper {
            align-items: flex-start;
        }

        .message {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.55;
            font-weight: 500;
            word-wrap: break-word;
        }

        /* Clean Markdown Styling */
        .bot-message p {
            margin-bottom: 8px;
        }

        .bot-message p:last-child {
            margin-bottom: 0;
        }

        .bot-message ul, .bot-message ol {
            margin: 6px 0 8px 18px;
            padding: 0;
        }

        .bot-message li {
            margin-bottom: 4px;
        }

        .bot-message code {
            background: rgba(0, 0, 0, 0.25);
            padding: 2px 6px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 0.88rem;
        }

        body.light-mode .bot-message code {
            background: rgba(0, 0, 0, 0.08);
        }

        .bot-message pre {
            background: rgba(0, 0, 0, 0.35);
            padding: 10px 14px;
            border-radius: 10px;
            overflow-x: auto;
            margin: 8px 0;
        }

        body.light-mode .bot-message pre {
            background: rgba(0, 0, 0, 0.06);
        }

        .bot-message pre code {
            background: transparent;
            padding: 0;
        }

        .user-message {
            background: var(--primary);
            color: white;
            border-radius: 16px 4px 16px 16px;
        }

        .bot-message {
            background: var(--surface);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 4px 16px 16px 16px;
        }

        .message-time {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .thinking {
            display: flex;
            gap: 4px;
            align-items: center;
            height: 20px;
        }

        .thinking-dot {
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .thinking-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .thinking-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .retry-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
        }

        .retry-btn:hover {
            background: var(--surface-hover);
        }

        .retry-btn:active {
            transform: scale(0.95);
        }

        .retry-btn svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }
        
        .input-wrapper {
            width: 100%;
            max-width: 900px;
            margin-bottom: 12px;
            padding: 0 12px;
        }

        .input-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 10px 12px 10px 18px;
            transition: all 0.2s ease;
        }

        .input-box:focus-within {
            background: var(--surface-hover);
            border-color: var(--primary);
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text);
        }

        input::placeholder {
            color: var(--text-muted);
            opacity: 0.6;
        }

        .send-btn {
            width: 36px;
            height: 36px;
            background: var(--primary);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .send-btn:hover:not(:disabled) {
            opacity: 0.9;
        }

        .send-btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .send-btn svg {
            width: 18px;
            height: 18px;
            fill: white;
        }

        @media (max-width: 768px) {
            body {
                padding: 16px 12px;
            }

            header {
                margin-bottom: 16px;
            }

            h1 {
                font-size: 1.25rem;
            }

            .message-wrapper {
                max-width: 90%;
            }

            .input-wrapper {
                padding: 0 8px;
            }

            .input-box {
                padding: 8px 10px 8px 14px;
            }

            #chat-container {
                gap: 10px;
                padding: 16px 8px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 14px 10px;
            }

            h1 {
                font-size: 1.1rem;
            }

            .brand-logo {
                width: 36px;
                height: 36px;
            }

            .brand-logo svg {
                width: 20px;
                height: 20px;
            }

            .message {
                font-size: 0.9rem;
                padding: 10px 14px;
            }

            .message-time {
                font-size: 0.7rem;
            }

            .message-wrapper {
                max-width: 95%;
            }

            .send-btn {
                width: 32px;
                height: 32px;
            }

            .send-btn svg {
                width: 16px;
                height: 16px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <div class="brand-logo">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="3" width="7" height="7" rx="2"></rect>
                    <rect x="14" y="3" width="7" height="7" rx="2"></rect>
                    <rect x="3" y="14" width="7" height="7" rx="2"></rect>
                    <rect x="14" y="14" width="7" height="7" rx="2"></rect>
                </svg>
            </div>
            <h1>Widget AI</h1>
        </div>
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
            <svg id="theme-icon" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
        </button>
    </header>

    <div id="chat-container">
        <div class="message-group bot">
            <div class="message-wrapper">
                <div class="message bot-message">
                    Hi! I'm Widget. How can I help you today?
                </div>
                <div class="message-time" id="init-time"></div>
            </div>
        </div>
    </div>

    <div class="input-wrapper">
        <form class="input-box glass" id="chat-form">
            <input type="text" id="user-input" placeholder="Type your message..." autocomplete="off" required>
            <button type="submit" class="send-btn" id="send-btn" aria-label="Send">
                <svg viewBox="0 0 24 24">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                </svg>
            </button>
        </form>
    </div>

    <script>
        const form = document.getElementById('chat-form');
        const input = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const chatContainer = document.getElementById('chat-container');
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const initTime = document.getElementById('init-time');

        initTime.textContent = getFormattedTime();

        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (!prefersDark) {
            document.body.classList.add('light-mode');
            updateThemeIcon();
        }

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            updateThemeIcon();
            localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
        });

        function updateThemeIcon() {
            if (document.body.classList.contains('light-mode')) {
                themeIcon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
            } else {
                themeIcon.innerHTML = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
            }
        }

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            document.body.classList.add('light-mode');
            updateThemeIcon();
        }

        function getFormattedTime() {
            const now = new Date();
            return now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
        }

        function appendMessage(text, className, isThinking = false) {
            const messageGroup = document.createElement('div');
            messageGroup.className = `message-group ${className === 'user-message' ? 'user' : 'bot'}`;

            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper';

            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;

            if (isThinking) {
                msgDiv.innerHTML = '<div class="thinking"><div class="thinking-dot"></div><div class="thinking-dot"></div><div class="thinking-dot"></div></div>';
            } else {
                msgDiv.textContent = text;
            }

            const timeDiv = document.createElement('div');
            timeDiv.className = 'message-time';
            timeDiv.textContent = getFormattedTime();

            wrapper.appendChild(msgDiv);
            wrapper.appendChild(timeDiv);
            messageGroup.appendChild(wrapper);
            chatContainer.appendChild(messageGroup);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            return msgDiv;
        }

        function addRetryButton(parentElement) {
            const retryBtn = document.createElement('button');
            retryBtn.className = 'retry-btn';
            retryBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg> Retry';
            
            retryBtn.addEventListener('click', async () => {
                retryBtn.disabled = true;
                retryBtn.style.opacity = '0.5';
                const lastUserMsg = Array.from(chatContainer.querySelectorAll('.message-group.user')).pop();
                if (lastUserMsg) {
                    const userText = lastUserMsg.querySelector('.message').textContent;
                    await handleSubmit(userText);
                }
                retryBtn.remove();
            });

            return retryBtn;
        }

        async function handleSubmit(message) {
            appendMessage(message, 'user-message');

            const thinkingMsg = appendMessage('', 'bot-message', true);
            const msgGroup = thinkingMsg.closest('.message-group');
            sendBtn.disabled = true;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                
                if (data.reply) {
                    thinkingMsg.innerHTML = marked.parse(data.reply);
                } else {
                    thinkingMsg.textContent = data.error || 'No response received.';
                }
            } catch (err) {
                thinkingMsg.textContent = 'Server connection failed. Please try again.';
                const retryBtn = addRetryButton(msgGroup);
                msgGroup.appendChild(retryBtn);
            } finally {
                thinkingMsg.classList.remove('thinking');
                sendBtn.disabled = false;
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = input.value.trim();
            if (!message) return;

            input.value = '';
            input.focus();

            await handleSubmit(message);
        });
    </script>
</body>
</html>
