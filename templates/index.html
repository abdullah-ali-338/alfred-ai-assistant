<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget AI</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2309090b'/><text y='.9em' font-size='65' x='18' fill='%235eead4' font-family='monospace' font-weight='bold'>&gt;_</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-dark: #0f0f0f;
            --bg-dark-secondary: #1a1a1a;
            --surface-dark: rgba(255, 255, 255, 0.08);
            --surface-dark-hover: rgba(255, 255, 255, 0.12);
            --border-dark: rgba(255, 255, 255, 0.1);
            --text-dark: #e5e5e5;
            --text-dark-muted: #a0a0a0;
            --primary-dark: #10a37f;

            --bg-light: #f7f7f7;
            --bg-light-secondary: #ffffff;
            --surface-light: rgba(0, 0, 0, 0.05);
            --surface-light-hover: rgba(0, 0, 0, 0.08);
            --border-light: rgba(0, 0, 0, 0.08);
            --text-light: #0d0d0d;
            --text-light-muted: #6b6b6b;
            --primary-light: #0d9678;

            --bg: var(--bg-dark);
            --bg-secondary: var(--bg-dark-secondary);
            --surface: var(--surface-dark);
            --surface-hover: var(--surface-dark-hover);
            --border: var(--border-dark);
            --text: var(--text-dark);
            --text-muted: var(--text-dark-muted);
            --primary: var(--primary-dark);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--bg) 0%, var(--bg-secondary) 100%);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 16px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        body.light-mode {
            --bg: var(--bg-light);
            --bg-secondary: var(--bg-light-secondary);
            --surface: var(--surface-light);
            --surface-hover: var(--surface-light-hover);
            --border: var(--border-light);
            --text: var(--text-light);
            --text-muted: var(--text-light-muted);
            --primary: var(--primary-light);
        }

        .glass {
            background: var(--surface);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 20px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 900px;
            margin-bottom: 20px;
            gap: 14px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 40px;
            height: 40px;
            background: var(--primary);
            border-radius: 12px;
            display: grid;
            place-items: center;
            flex-shrink: 0;
        }

        .brand-logo svg {
            width: 22px;
            height: 22px;
            fill: var(--bg);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(16, 163, 127, 0.15);
            border: 1px solid rgba(16, 163, 127, 0.25);
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--primary);
            letter-spacing: 0.3px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--primary);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.6;
                transform: scale(1.2);
            }
        }

        .theme-toggle {
            width: 44px;
            height: 44px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .theme-toggle:hover {
            background: var(--surface-hover);
        }

        .theme-toggle svg {
            width: 20px;
            height: 20px;
            fill: var(--text);
            transition: transform 0.3s ease;
        }

        .theme-toggle:active {
            transform: scale(0.95);
        }

        #chat-container {
            width: 100%;
            max-width: 900px;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 20px 12px;
            scrollbar-width: thin;
            scrollbar-color: var(--surface) transparent;
        }

        #chat-container::-webkit-scrollbar {
            width: 6px;
        }

        #chat-container::-webkit-scrollbar-track {
            background: transparent;
        }

        #chat-container::-webkit-scrollbar-thumb {
            background: var(--surface);
            border-radius: 3px;
        }

        #chat-container::-webkit-scrollbar-thumb:hover {
            background: var(--surface-hover);
        }

        .message-group {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            animation: slideIn 0.3s ease-out;
        }

        .message-group.user {
            justify-content: flex-end;
        }

        .message-group.bot {
            justify-content: flex-start;
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-width: 85%;
            position: relative;
        }

        .message-group.user .message-wrapper {
            align-items: flex-end;
        }

        .message-group.bot .message-wrapper {
            align-items: flex-start;
        }

        .message {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.5;
            font-weight: 500;
            word-wrap: break-word;
            position: relative;
        }

        .user-message {
            background: var(--primary);
            color: white;
            border-radius: 16px 4px 16px 16px;
        }

        .bot-message {
            background: var(--surface);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 4px 16px 16px 16px;
        }

        .bot-message.animating {
            min-height: 40px;
        }

        .message-time {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .thinking {
            display: flex;
            gap: 4px;
            align-items: center;
            height: 20px;
        }

        .thinking-dot {
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .thinking-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .thinking-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                opacity: 0.5;
                transform: translateY(0);
            }
            40% {
                opacity: 1;
                transform: translateY(-8px);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Markdown Rendering */
        .message-content {
            width: 100%;
        }

        .message-content h1, .message-content h2, .message-content h3,
        .message-content h4, .message-content h5, .message-content h6 {
            margin-top: 12px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .message-content h1 { font-size: 1.3rem; }
        .message-content h2 { font-size: 1.2rem; }
        .message-content h3 { font-size: 1.1rem; }

        .message-content p {
            margin-bottom: 8px;
        }

        .message-content ul, .message-content ol {
            margin-left: 20px;
            margin-bottom: 8px;
        }

        .message-content li {
            margin-bottom: 4px;
        }

        .message-content strong {
            font-weight: 700;
        }

        .message-content em {
            font-style: italic;
        }

        .message-content code {
            background: rgba(0, 0, 0, 0.2);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }

        .message-content pre {
            margin: 12px 0;
            border-radius: 8px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.3);
        }

        .code-block-wrapper {
            position: relative;
            margin: 12px 0;
        }

        .code-block-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .code-language {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .code-copy-btn {
            background: rgba(16, 163, 127, 0.2);
            border: 1px solid rgba(16, 163, 127, 0.3);
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .code-copy-btn:hover {
            background: rgba(16, 163, 127, 0.3);
            border-color: rgba(16, 163, 127, 0.5);
        }

        .code-copy-btn.copied {
            background: rgba(16, 163, 127, 0.3);
            color: var(--primary);
        }

        .code-block-wrapper code {
            display: block;
            padding: 12px;
            background: transparent;
            overflow-x: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            line-height: 1.5;
        }

        .message-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
        }

        .message-group.bot:hover .message-actions {
            opacity: 1;
            pointer-events: all;
        }

        .message-action-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .message-action-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: var(--text);
        }

        .message-action-btn.copied {
            background: rgba(16, 163, 127, 0.2);
            color: var(--primary);
            border-color: rgba(16, 163, 127, 0.3);
        }

        .message-action-btn svg {
            width: 14px;
            height: 14px;
        }

        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            margin: auto;
            text-align: center;
        }

        .empty-state-greeting {
            font-size: 1.1rem;
            color: var(--text);
            font-weight: 600;
        }

        .quick-prompts {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 400px;
        }

        .prompt-pill {
            padding: 12px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text);
            text-align: left;
        }

        .prompt-pill:hover {
            background: var(--surface-hover);
            border-color: rgba(16, 163, 127, 0.5);
            transform: translateX(4px);
        }

        .prompt-pill:active {
            transform: scale(0.98);
        }

        /* Input */
        .input-wrapper {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: center;
            padding: 0 12px 12px 12px;
        }

        .input-box {
            glass: '';
            display: flex;
            gap: 8px;
            padding: 12px;
            width: 100%;
            max-width: 900px;
            align-items: flex-end;
        }

        .input-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-height: 44px;
        }

        #user-input {
            width: 100%;
            padding: 10px 12px;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 0.95rem;
            font-weight: 500;
            resize: none;
            outline: none;
            max-height: 150px;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        #user-input::placeholder {
            color: var(--text-muted);
        }

        #user-input::-webkit-scrollbar {
            width: 4px;
        }

        #user-input::-webkit-scrollbar-thumb {
            background: var(--surface);
            border-radius: 2px;
        }

        .send-btn {
            width: 40px;
            height: 40px;
            background: var(--primary);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .send-btn svg {
            width: 20px;
            height: 20px;
            fill: var(--bg);
            transition: transform 0.2s ease;
        }

        .send-btn:hover {
            transform: scale(1.05);
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .retry-btn {
            padding: 8px 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .retry-btn:hover {
            background: var(--surface-hover);
            color: var(--text);
        }

        .retry-btn svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        @media (max-width: 768px) {
            body {
                padding: 16px 12px;
                margin-bottom: 12px;
            }

            header {
                margin-bottom: 16px;
            }

            h1 {
                font-size: 1.25rem;
            }

            .message-wrapper {
                max-width: 90%;
            }

            .input-wrapper {
                padding: 0 8px;
            }

            .input-box {
                padding: 8px 10px 8px 14px;
            }

            #chat-container {
                gap: 10px;
                padding: 16px 8px;
            }

            .message-actions {
                position: absolute;
                bottom: -32px;
                right: 0;
                opacity: 1;
                pointer-events: all;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 14px 10px;
            }

            h1 {
                font-size: 1.1rem;
            }

            .brand-logo {
                width: 36px;
                height: 36px;
            }

            .brand-logo svg {
                width: 20px;
                height: 20px;
            }

            .status-pill {
                display: none;
            }

            .message {
                font-size: 0.9rem;
                padding: 10px 14px;
            }

            .message-time {
                font-size: 0.7rem;
            }

            .message-wrapper {
                max-width: 95%;
            }

            .send-btn {
                width: 32px;
                height: 32px;
            }

            .send-btn svg {
                width: 16px;
                height: 16px;
            }

            .quick-prompts {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <div class="brand-logo">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="3" width="7" height="7" rx="2"></rect>
                    <rect x="14" y="3" width="7" height="7" rx="2"></rect>
                    <rect x="3" y="14" width="7" height="7" rx="2"></rect>
                    <rect x="14" y="14" width="7" height="7" rx="2"></rect>
                </svg>
            </div>
            <h1>Widget AI</h1>
            <div class="status-pill">
                <div class="status-dot"></div>
                <span>Groq Engine Online</span>
            </div>
        </div>
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
            <svg id="theme-icon" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
        </button>
    </header>

    <div id="chat-container">
        <div class="empty-state" id="empty-state">
            <div class="empty-state-greeting">Hi! I'm Widget. How can I help you today?</div>
            <div class="quick-prompts">
                <button class="prompt-pill" data-prompt="Explain DNS resolution">Explain DNS resolution</button>
                <button class="prompt-pill" data-prompt="Python script to scrape a website">Python script to scrape a website</button>
                <button class="prompt-pill" data-prompt="TCP vs UDP key differences">TCP vs UDP key differences</button>
            </div>
        </div>
    </div>

    <div class="input-wrapper">
        <form class="input-box glass" id="chat-form">
            <div class="input-area">
                <textarea id="user-input" placeholder="Type your message..." autocomplete="off" required></textarea>
            </div>
            <button type="submit" class="send-btn" id="send-btn" aria-label="Send">
                <svg viewBox="0 0 24 24">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                </svg>
            </button>
        </form>
    </div>

    <script>
        const form = document.getElementById('chat-form');
        const input = document.getElementById('user-input');
        const chatContainer = document.getElementById('chat-container');
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const emptyState = document.getElementById('empty-state');
        const promptPills = document.querySelectorAll('.prompt-pill');

        // Auto-expand textarea
        function autoExpandTextarea() {
            input.style.height = 'auto';
            const scrollHeight = input.scrollHeight;
            input.style.height = Math.min(scrollHeight, 150) + 'px';
        }

        input.addEventListener('input', autoExpandTextarea);

        // Handle Enter to send, Shift+Enter for newline
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                form.dispatchEvent(new Event('submit'));
            }
        });

        // Quick prompt handlers
        promptPills.forEach(pill => {
            pill.addEventListener('click', () => {
                const prompt = pill.dataset.prompt;
                input.value = prompt;
                autoExpandTextarea();
                input.focus();
                handleSubmit(prompt);
            });
        });

        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (!prefersDark) {
            document.body.classList.add('light-mode');
            updateThemeIcon();
        }

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            updateThemeIcon();
            localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
        });

        function updateThemeIcon() {
            if (document.body.classList.contains('light-mode')) {
                themeIcon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
            } else {
                themeIcon.innerHTML = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
            }
        }

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            document.body.classList.add('light-mode');
            updateThemeIcon();
        }

        function getFormattedTime() {
            const now = new Date();
            return now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
        }

        function removeEmptyState() {
            if (emptyState) emptyState.remove();
        }

        function createMessageGroup(isUser) {
            const messageGroup = document.createElement('div');
            messageGroup.className = `message-group ${isUser ? 'user' : 'bot'}`;

            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper';

            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;

            const timeDiv = document.createElement('div');
            timeDiv.className = 'message-time';
            timeDiv.textContent = getFormattedTime();

            wrapper.appendChild(msgDiv);
            wrapper.appendChild(timeDiv);
            messageGroup.appendChild(wrapper);

            return { messageGroup, msgDiv, wrapper };
        }

        function appendMessage(text, isUser, isThinking = false) {
            const { messageGroup, msgDiv, wrapper } = createMessageGroup(isUser);

            if (isThinking) {
                msgDiv.innerHTML = '<div class="thinking"><div class="thinking-dot"></div><div class="thinking-dot"></div><div class="thinking-dot"></div></div>';
            } else {
                msgDiv.textContent = text;
            }

            chatContainer.appendChild(messageGroup);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            return { msgDiv, wrapper, messageGroup };
        }

        function parseMarkdownToHTML(markdown) {
            let html = marked.parse(markdown);
            
            // Wrap code blocks with custom structure
            html = html.replace(
                /<pre><code class="language-([^"]*)">([\s\S]*?)<\/code><\/pre>/g,
                (match, lang, code) => {
                    const language = lang || 'code';
                    const cleanCode = code.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
                    return `
                        <div class="code-block-wrapper">
                            <div class="code-block-header">
                                <span class="code-language">${language}</span>
                                <button class="code-copy-btn" data-code="${btoa(cleanCode)}">Copy Code</button>
                            </div>
                            <pre><code>${code}</code></pre>
                        </div>
                    `;
                }
            );

            // Fallback for code blocks without language
            html = html.replace(
                /<pre><code>([\s\S]*?)<\/code><\/pre>/g,
                (match, code) => {
                    const cleanCode = code.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
                    return `
                        <div class="code-block-wrapper">
                            <div class="code-block-header">
                                <span class="code-language">code</span>
                                <button class="code-copy-btn" data-code="${btoa(cleanCode)}">Copy Code</button>
                            </div>
                            <pre><code>${code}</code></pre>
                        </div>
                    `;
                }
            );

            return html;
        }

        async function typewriterEffect(element, markdown, speed = 20) {
            const html = parseMarkdownToHTML(markdown);
            const parser = new DOMParser();
            const doc = parser.parseFromString(`<div>${html}</div>`, 'text/html');
            const nodes = Array.from(doc.body.firstChild.childNodes);

            element.classList.add('animating');
            element.innerHTML = '';

            let totalChars = 0;
            const charCounts = nodes.map(node => {
                const count = node.textContent.length;
                totalChars += count;
                return count;
            });

            let charIndex = 0;
            let nodeIndex = 0;
            let currentNode = null;

            function typeNextChar() {
                if (nodeIndex >= nodes.length) {
                    element.classList.remove('animating');
                    attachCodeBlockHandlers();
                    attachCopyButton(element);
                    return;
                }

                if (!currentNode) {
                    currentNode = nodes[nodeIndex].cloneNode(true);
                    if (currentNode.nodeType === Node.TEXT_NODE) {
                        currentNode = document.createTextNode('');
                    }
                    element.appendChild(currentNode);
                }

                const original = nodes[nodeIndex];
                if (original.nodeType === Node.TEXT_NODE) {
                    const text = original.textContent;
                    if (charIndex < text.length) {
                        currentNode.textContent += text[charIndex];
                        charIndex++;
                    } else {
                        charIndex = 0;
                        nodeIndex++;
                        currentNode = null;
                    }
                } else {
                    nodeIndex++;
                    currentNode = null;
                }

                chatContainer.scrollTop = chatContainer.scrollHeight;
                setTimeout(typeNextChar, speed);
            }

            typeNextChar();
        }

        function attachCodeBlockHandlers() {
            const codeCopyBtns = document.querySelectorAll('.code-copy-btn');
            codeCopyBtns.forEach(btn => {
                btn.removeEventListener('click', handleCodeCopy);
                btn.addEventListener('click', handleCodeCopy);
            });
        }

        function handleCodeCopy(e) {
            const btn = e.target.closest('.code-copy-btn');
            const encodedCode = btn.dataset.code;
            const code = atob(encodedCode);

            navigator.clipboard.writeText(code).then(() => {
                const originalText = btn.textContent;
                btn.classList.add('copied');
                btn.textContent = 'Copied!';

                setTimeout(() => {
                    btn.classList.remove('copied');
                    btn.textContent = originalText;
                }, 2000);
            }).catch(err => console.error('Copy failed:', err));
        }

        function attachCopyButton(messageDiv) {
            const messageWrapper = messageDiv.closest('.message-wrapper');
            if (!messageWrapper) return;

            let actionsDiv = messageWrapper.querySelector('.message-actions');
            if (!actionsDiv) {
                actionsDiv = document.createElement('div');
                actionsDiv.className = 'message-actions';
                messageWrapper.appendChild(actionsDiv);
            }

            const copyBtn = document.createElement('button');
            copyBtn.className = 'message-action-btn';
            copyBtn.innerHTML = '<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> Copy Response';
            copyBtn.type = 'button';

            copyBtn.addEventListener('click', () => {
                const text = messageDiv.innerText;
                navigator.clipboard.writeText(text).then(() => {
                    copyBtn.classList.add('copied');
                    copyBtn.textContent = '✓ Copied!';
                    setTimeout(() => {
                        copyBtn.classList.remove('copied');
                        copyBtn.innerHTML = '<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> Copy Response';
                    }, 2000);
                });
            });

            actionsDiv.appendChild(copyBtn);
        }

        function addRetryButton(msgGroup) {
            const retryBtn = document.createElement('button');
            retryBtn.className = 'retry-btn';
            retryBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg> Retry';
            
            retryBtn.addEventListener('click', async () => {
                retryBtn.disabled = true;
                retryBtn.style.opacity = '0.5';
                const lastUserMsg = Array.from(chatContainer.querySelectorAll('.message-group.user')).pop();
                if (lastUserMsg) {
                    const userText = lastUserMsg.querySelector('.message').textContent;
                    await handleSubmit(userText);
                }
                retryBtn.remove();
            });

            msgGroup.appendChild(retryBtn);
        }

        async function handleSubmit(message) {
            removeEmptyState();
            
            const { msgDiv: userMsg } = appendMessage(message, true);

            const { msgDiv: botMsg, wrapper: botWrapper, messageGroup: botGroup } = appendMessage('', false, true);

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                const reply = data.reply || 'No response received.';

                await typewriterEffect(botMsg, reply, 15);
            } catch (err) {
                botMsg.textContent = 'Server connection failed. Please try again.';
                botMsg.classList.remove('animating');
                addRetryButton(botGroup);
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = input.value.trim();
            if (!message) return;

            input.value = '';
            input.style.height = 'auto';
            input.focus();

            await handleSubmit(message);
        });
    </script>
</body>
