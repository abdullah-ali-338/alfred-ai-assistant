<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget AI</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2309090b'/><text y='.9em' font-size='65' x='18' fill='%235eead4' font-family='monospace' font-weight='bold'>&gt;_</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-dark: #0f0f0f;
            --bg-dark-secondary: #1a1a1a;
            --surface-dark: rgba(255, 255, 255, 0.08);
            --surface-dark-hover: rgba(255, 255, 255, 0.12);
            --border-dark: rgba(255, 255, 255, 0.1);
            --text-dark: #e5e5e5;
            --text-dark-muted: #a0a0a0;
            --primary-dark: #10a37f;

            --bg-light: #f7f7f7;
            --bg-light-secondary: #ffffff;
            --surface-light: rgba(0, 0, 0, 0.05);
            --surface-light-hover: rgba(0, 0, 0, 0.08);
            --border-light: rgba(0, 0, 0, 0.08);
            --text-light: #0d0d0d;
            --text-light-muted: #6b6b6b;
            --primary-light: #0d9678;

            --bg: var(--bg-dark);
            --bg-secondary: var(--bg-dark-secondary);
            --surface: var(--surface-dark);
            --surface-hover: var(--surface-dark-hover);
            --border: var(--border-dark);
            --text: var(--text-dark);
            --text-muted: var(--text-dark-muted);
            --primary: var(--primary-dark);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--bg) 0%, var(--bg-secondary) 100%);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 16px;
            overflow: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        body.light-mode {
            --bg: var(--bg-light);
            --bg-secondary: var(--bg-light-secondary);
            --surface: var(--surface-light);
            --surface-hover: var(--surface-light-hover);
            --border: var(--border-light);
            --text: var(--text-light);
            --text-muted: var(--text-light-muted);
            --primary: var(--primary-light);
        }

        .glass {
            background: var(--surface);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 20px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 900px;
            margin-bottom: 12px;
            gap: 14px;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 40px;
            height: 40px;
            background: var(--primary);
            border-radius: 12px;
            display: grid;
            place-items: center;
            flex-shrink: 0;
        }

        .brand-logo svg {
            width: 22px;
            height: 22px;
            fill: var(--bg);
        }

        h1 {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text-muted);
        }

        .pulse-dot {
            width: 7px;
            height: 7px;
            background-color: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(16, 163, 127, 0.7);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 163, 127, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 163, 127, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 163, 127, 0); }
        }

        .theme-toggle {
            width: 42px;
            height: 42px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .theme-toggle:hover {
            background: var(--surface-hover);
        }

        .theme-toggle svg {
            width: 18px;
            height: 18px;
            fill: var(--text);
            transition: transform 0.3s ease;
        }

        /* --- CHAT WRAPPER WITH LIQUID EDGE FADE & BLUR --- */
        .chat-viewport {
            width: 100%;
            max-width: 900px;
            flex: 1;
            position: relative;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        #chat-container {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 24px 8px;
            scrollbar-width: thin;
            scrollbar-color: var(--surface) transparent;
            /* Liquid smooth fade on top and bottom */
            mask-image: linear-gradient(
                to bottom,
                transparent 0%,
                black 38px,
                black calc(100% - 38px),
                transparent 100%
            );
            -webkit-mask-image: linear-gradient(
                to bottom,
                transparent 0%,
                black 38px,
                black calc(100% - 38px),
                transparent 100%
            );
        }

        #chat-container::-webkit-scrollbar {
            width: 6px;
        }

        #chat-container::-webkit-scrollbar-track {
            background: transparent;
        }

        #chat-container::-webkit-scrollbar-thumb {
            background: var(--surface);
            border-radius: 3px;
        }

        .quick-chips-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .chip {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .chip:hover {
            background: var(--surface-hover);
            border-color: var(--primary);
            transform: translateY(-1px);
        }

        .message-group {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            animation: slideIn 0.25s ease-out;
        }

        .message-group.user {
            justify-content: flex-end;
        }

        .message-group.bot {
            justify-content: flex-start;
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            gap: 5px;
            max-width: 82%;
        }

        .message-group.user .message-wrapper {
            align-items: flex-end;
        }

        .message-group.bot .message-wrapper {
            align-items: flex-start;
        }

        .message {
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 0.94rem;
            line-height: 1.55;
            font-weight: 500;
            word-wrap: break-word;
        }

        .user-message {
            background: var(--primary);
            color: #ffffff;
            border-radius: 18px 4px 18px 18px;
        }

        .bot-message {
            background: var(--surface);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 4px 18px 18px 18px;
        }

        .bot-message p {
            margin-bottom: 8px;
        }

        .bot-message p:last-child {
            margin-bottom: 0;
        }

        .bot-message ul, .bot-message ol {
            margin: 6px 0 8px 20px;
        }

        .bot-message li {
            margin-bottom: 4px;
        }

        .bot-message code {
            background: rgba(0, 0, 0, 0.28);
            padding: 2px 6px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 0.88rem;
        }

        body.light-mode .bot-message code {
            background: rgba(0, 0, 0, 0.08);
        }

        .bot-message pre {
            background: rgba(0, 0, 0, 0.38);
            padding: 12px 14px;
            border-radius: 10px;
            overflow-x: auto;
            margin: 10px 0;
        }

        body.light-mode .bot-message pre {
            background: rgba(0, 0, 0, 0.06);
        }

        .bot-message pre code {
            background: transparent;
            padding: 0;
        }

        .message-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 4px;
        }

        .message-time {
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        .copy-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.72rem;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 6px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .copy-btn:hover {
            color: var(--text);
            background: var(--surface);
        }

        .copy-btn svg {
            width: 12px;
            height: 12px;
            fill: currentColor;
        }

        .thinking {
            display: flex;
            gap: 5px;
            align-items: center;
            height: 22px;
        }

        .thinking-dot {
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .thinking-dot:nth-child(2) { animation-delay: 0.2s; }
        .thinking-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-7px); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Input Area */
        .input-wrapper {
            width: 100%;
            max-width: 900px;
            margin-bottom: 8px;
            margin-top: 6px;
            padding: 0 4px;
            z-index: 10;
        }

        .input-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--surface);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 8px 10px 8px 18px;
            transition: all 0.2s ease;
        }

        .input-box:focus-within {
            background: var(--surface-hover);
            border-color: var(--primary);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text);
            resize: none;
            height: 24px;
            min-height: 24px;
            max-height: 130px;
            line-height: 24px;
            padding: 0;
            margin: 0;
            display: block;
        }

        textarea::placeholder {
            color: var(--text-muted);
            opacity: 0.65;
            line-height: 24px;
        }

        .send-btn {
            width: 38px;
            height: 38px;
            background: var(--primary);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .send-btn:hover:not(:disabled) { opacity: 0.9; }
        .send-btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .send-btn svg { width: 17px; height: 17px; fill: white; }

        @media (max-width: 768px) {
            body { padding: 12px 10px; }
            header { margin-bottom: 8px; }
            h1 { font-size: 1.2rem; }
            .status-badge { display: none; }
            .message-wrapper { max-width: 90%; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <div class="brand-logo">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="3" width="7" height="7" rx="2"></rect>
                    <rect x="14" y="3" width="7" height="7" rx="2"></rect>
                    <rect x="3" y="14" width="7" height="7" rx="2"></rect>
                    <rect x="14" y="14" width="7" height="7" rx="2"></rect>
                </svg>
            </div>
            <div>
                <h1>Widget AI</h1>
            </div>
            <div class="status-badge">
                <span class="pulse-dot"></span>
                <span>Groq Online</span>
            </div>
        </div>
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
            <svg id="theme-icon" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
        </button>
    </header>

    <div class="chat-viewport">
        <div id="chat-container">
            <div class="message-group bot">
                <div class="message-wrapper">
                    <div class="message bot-message">
                        Hi! I'm Widget. How can I assist you right now?
                    </div>
                    <div class="quick-chips-wrapper" id="quick-chips">
                        <button class="chip" onclick="submitChip('Explain DNS resolution in simple terms')">Explain DNS resolution</button>
                        <button class="chip" onclick="submitChip('Write a Python script to scrape website title')">Python Web Scraper</button>
                        <button class="chip" onclick="submitChip('Key differences between TCP and UDP')">TCP vs UDP</button>
                    </div>
                    <div class="message-meta">
                        <span class="message-time" id="init-time"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="input-wrapper">
        <form class="input-box glass" id="chat-form">
            <textarea id="user-input" rows="1" placeholder="Ask anything... (Enter to send, Shift+Enter for newline)" required></textarea>
            <button type="submit" class="send-btn" id="send-btn" aria-label="Send">
                <svg viewBox="0 0 24 24">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                </svg>
            </button>
        </form>
    </div>

    <script>
        const form = document.getElementById('chat-form');
        const input = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const chatContainer = document.getElementById('chat-container');
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const initTime = document.getElementById('init-time');

        initTime.textContent = getFormattedTime();

        input.addEventListener('input', () => {
            input.style.height = '24px';
            input.style.height = Math.min(input.scrollHeight, 130) + 'px';
            const box = input.closest('.input-box');
            if (input.scrollHeight > 36) {
                box.style.alignItems = 'flex-end';
            } else {
                box.style.alignItems = 'center';
            }
        });

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                form.dispatchEvent(new Event('submit'));
            }
        });

        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (!prefersDark) {
            document.body.classList.add('light-mode');
            updateThemeIcon();
        }

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            updateThemeIcon();
            localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
        });

        function updateThemeIcon() {
            if (document.body.classList.contains('light-mode')) {
                themeIcon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
            } else {
                themeIcon.innerHTML = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
            }
        }

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            document.body.classList.add('light-mode');
            updateThemeIcon();
        }

        function getFormattedTime() {
            return new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
        }

        function appendMessage(text, className, isThinking = false) {
            const messageGroup = document.createElement('div');
            messageGroup.className = `message-group ${className === 'user-message' ? 'user' : 'bot'}`;

            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper';

            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;

            if (isThinking) {
                msgDiv.innerHTML = '<div class="thinking"><div class="thinking-dot"></div><div class="thinking-dot"></div><div class="thinking-dot"></div></div>';
            } else {
                msgDiv.textContent = text;
            }

            const metaDiv = document.createElement('div');
            metaDiv.className = 'message-meta';

            const timeDiv = document.createElement('span');
            timeDiv.className = 'message-time';
            timeDiv.textContent = getFormattedTime();
            metaDiv.appendChild(timeDiv);

            wrapper.appendChild(msgDiv);
            wrapper.appendChild(metaDiv);
            messageGroup.appendChild(wrapper);
            chatContainer.appendChild(messageGroup);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            return { msgDiv, metaDiv };
        }

        function addCopyButton(metaElement, textToCopy) {
            const copyBtn = document.createElement('button');
            copyBtn.className = 'copy-btn';
            copyBtn.innerHTML = '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> Copy';
            
            copyBtn.addEventListener('click', () => {
                navigator.clipboard.writeText(textToCopy).then(() => {
                    copyBtn.textContent = 'Copied!';
                    setTimeout(() => {
                        copyBtn.innerHTML = '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> Copy';
                    }, 2000);
                });
            });
            metaElement.appendChild(copyBtn);
        }

        function streamMarkdownText(element, fullText, metaElement) {
            element.classList.remove('thinking');
            const words = fullText.split(' ');
            let currentIndex = 0;
            element.innerHTML = '';

            const interval = setInterval(() => {
                if (currentIndex < words.length) {
                    const partial = words.slice(0, currentIndex + 1).join(' ');
                    element.innerHTML = marked.parse(partial);
                    currentIndex++;
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                } else {
                    clearInterval(interval);
                    element.innerHTML = marked.parse(fullText);
                    addCopyButton(metaElement, fullText);
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                }
            }, 18);
        }

        function submitChip(text) {
            const chips = document.getElementById('quick-chips');
            if (chips) chips.remove();
            handleSubmit(text);
        }

        async function handleSubmit(message) {
            appendMessage(message, 'user-message');
            input.value = '';
            input.style.height = '24px';
            input.closest('.input-box').style.alignItems = 'center';
            sendBtn.disabled = true;

            const chips = document.getElementById('quick-chips');
            if (chips) chips.remove();

            const { msgDiv, metaDiv } = appendMessage('', 'bot-message', true);

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                
                if (data.reply) {
                    streamMarkdownText(msgDiv, data.reply, metaDiv);
                } else {
                    msgDiv.classList.remove('thinking');
                    msgDiv.textContent = data.error || 'No response received.';
                }
            } catch (err) {
                msgDiv.classList.remove('thinking');
                msgDiv.textContent = 'Server connection failed. Please try again.';
            } finally {
                sendBtn.disabled = false;
            }
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const message = input.value.trim();
            if (!message) return;
            handleSubmit(message);
        });
    </script>
</body>
</html>
